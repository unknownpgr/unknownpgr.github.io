services:
  blog:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
    logging:
      options:
        max-size: "1m"

# Join the shared reverse proxy network. The proxy (nginx-proxy-manager)
# routes incoming traffic to this service as `blog:80`.
networks:
  default:
    name: reverse-proxy
    external: true
